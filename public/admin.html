<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Tambah Tugas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tambah Tugas</h1>
    <form id="form">
      <label>Hari:
        <select id="hari">
          <option>Senin</option>
          <option>Selasa</option>
          <option>Rabu</option>
          <option>Kamis</option>
          <option>Jumat</option>
          <option>Sabtu</option>
          <option>Minggu</option>
        </select>
      </label>
      <label>Tugas:
        <input type="text" id="tugas" required />
      </label>
      <button type="submit">Kirim</button>
    </form>
    <p id="status"></p>
  </div>

  <script>
    const url = new URL(window.location.href);
    const token = url.searchParams.get("token");
    if (token !== "gurukelas123") {
      document.body.innerHTML = "<h2>Akses ditolak</h2>";
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const hari = document.getElementById("hari").value;
      const tugas = document.getElementById("tugas").value;

      const res = await fetch("/api/tugas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hari, tugas })
      });

      const data = await res.json();
      document.getElementById("status").innerText = data.message || "Gagal";
    });
  </script>
</body>
</html>
