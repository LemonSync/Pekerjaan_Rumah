<!DOCTYPE html>
<html>
<head>
  <title>Pengingat Tugas Besok</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Tugas untuk Besok</h1>
  <ul id="tugas-list"></ul>

  <script>
    fetch('/api/tugas')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("tugas-list");
        if (Object.keys(data).length === 0) {
          list.innerHTML = "<li>Tidak ada tugas</li>";
        } else {
          Object.values(data).forEach(tugas => {
            const li = document.createElement("li");
            li.textContent = tugas;
            list.appendChild(li);
          });
        }
      });
  </script>
</body>
</html>
