<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Pengingat Tugas Besok</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 id="judul">📅 Tugas yang harus dikumpulkan pada ...</h1>
  <div id="tugas-container"></div>

  <script>
    const besok = new Date();
    besok.setDate(besok.getDate() + 1);
    const yyyy = besok.getFullYear();
    const mm = String(besok.getMonth() + 1).padStart(2, '0');
    const dd = String(besok.getDate()).padStart(2, '0');
    const tanggalBesokKey = `${yyyy}-${mm}-${dd}`;
    const tanggalTampil = `${dd}/${mm}/${String(yyyy).slice(-2)}`;

    document.getElementById("judul").textContent =
      `📅 Tugas yang harus dikumpulkan pada ${tanggalTampil}`;

    fetch('/api/tugas')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("tugas-container");
        container.innerHTML = "";

        const tugasList = Object.values(data);
        if (tugasList.length === 0) {
          container.innerHTML = `<p>Tidak ada tugas untuk besok.</p>`;
        } else {
          tugasList.forEach((tugas, index) => {
            const div = document.createElement("div");
            div.className = "tugas-item";
            div.innerHTML = `
              <p><strong>${index + 1}. ${tugas.namaTugas || "Tanpa Nama Tugas"}</strong></p>
              <p>&nbsp;&nbsp;&bull; Deskripsi: ${tugas.deskripsi || "-"}</p><br>
            `;
            container.appendChild(div);
          });
        }
      })
      .catch(() => {
        document.getElementById("tugas-container").innerHTML =
          "<p>❌ Gagal memuat data tugas.</p>";
      });
  </script>
</body>
</html>
