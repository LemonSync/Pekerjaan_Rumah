<!DOCTYPE html>
<html>
<head>
  <title>Tambah Tugas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Tambah Tugas Baru</h1>
  <form id="form">
    <label>Tanggal (YYYY-MM-DD): <input type="date" id="tanggal" required /></label><br><br>
    <label>Isi Tugas: <input type="text" id="tugas" required /></label><br><br>
    <button type="submit">Tambah</button>
  </form>
  <p id="status"></p>

  <script>
  const url = new URL(window.location.href);
const token = url.searchParams.get("token");
if (token !== "gurukelas123") {
  document.body.innerHTML = "<h2>Akses ditolak</h2>";
}
  
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const tanggal = document.getElementById("tanggal").value;
      const tugas = document.getElementById("tugas").value;

      const res = await fetch("/api/tugas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tanggal, tugas })
      });

      document.getElementById("status").textContent = res.ok
        ? "Tugas berhasil ditambahkan!"
        : "Gagal menambahkan tugas!";
    };
  </script>
</body>
</html>
